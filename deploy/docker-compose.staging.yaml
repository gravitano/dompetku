# DompetKu — staging. Compose project: dompetku-staging
#   docker compose -p dompetku-staging -f deploy/docker-compose.staging.yaml --env-file deploy/.env.staging up -d
# Secret (DATABASE_URL, BETTER_AUTH_SECRET, POSTGRES_PASSWORD, S3_*) hanya di
# file .env.staging di VPS — tidak pernah di repo.
name: dompetku-staging

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER wajib di-set}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD wajib di-set}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB wajib di-set}
    volumes:
      - db-data:/var/lib/postgresql/data
    networks: [internal]
    # Tidak ada `ports`: database tidak diekspos ke publik (ITA §6.2).
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  migrate:
    image: ghcr.io/gravitano/dompetku-migrate:${IMAGE_TAG:-staging}
    env_file: .env.staging
    depends_on:
      db:
        condition: service_healthy
    networks: [internal]
    restart: "no"
    profiles: [migrate]

  app:
    image: ghcr.io/gravitano/dompetku:${IMAGE_TAG:-staging}
    restart: unless-stopped
    env_file: .env.staging
    environment:
      NODE_ENV: production
      PORT: 3000
    depends_on:
      db:
        condition: service_healthy
    networks:
      internal: {}
      web:
        aliases: [dompetku-staging-app]

volumes:
  db-data:

networks:
  internal: {}
  # Network bersama dengan Caddy (dibuat sekali: `docker network create web`).
  web:
    external: true
