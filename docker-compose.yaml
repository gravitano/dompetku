# Development lokal: hanya database. Jalankan app dengan `pnpm dev` (dari root; app di apps/web).
#   docker compose up -d db
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dompetku}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dompetku}
      POSTGRES_DB: ${POSTGRES_DB:-dompetku}
      TZ: UTC
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db-data:
